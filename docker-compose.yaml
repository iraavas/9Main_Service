services:
  main-service:
    image: iraavas/17main-service
    container_name: spring-boot-app
    restart: always
    ports:
      - "${MAIN_SERVICE_PORT}:8081"
    networks:
      - app-network
    mem_limit: ${APP_MEM_LIMIT}
    cpus: ${APP_CPU_LIMIT}
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL}
      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: true
      SERVER_PORT: ${MAIN_SERVICE_PORT}
      TOMCAT_THREADS: ${TOMCAT_THREADS}

      # Kafka
      KAFKA_HOSTS: ${KAFKA_HOSTS:-hl22.zil:9094,hl23.zil:9094}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-ivas-consumer-group}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-var02_}
      KAFKA_CONCURRENCY: ${KAFKA_CONCURRENCY:-2}

      # Observability
      STATISTICS_OBSERVABILITY: true
      OBSERVABILITY_INTERVALS: 10,30,60
      SERVICE_STATISTIC_OBSERVABILITY_DELAY: 5000

  additional-service:
    image: iraavas/16additional-service
    container_name: additional-service
    restart: always
    depends_on:
      - main-service
    ports:
      - "${ADDITIONAL_SERVICE_PORT}:8082"
    networks:
      - app-network
    mem_limit: ${APP_MEM_LIMIT}
    cpus: ${APP_CPU_LIMIT}
    environment:
      MAIN_SERVICE_HOST: ${MAIN_SERVICE_HOST}
      MAIN_SERVICE_PORT: ${MAIN_SERVICE_PORT}
      SERVER_PORT: ${ADDITIONAL_SERVICE_PORT}
      TOMCAT_THREADS: ${TOMCAT_THREADS}

      # Retry
      CORE_CRASH_DELAY: ${CORE_CRASH_DELAY:-10000}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-7}
      RETRY_WAIT_DURATION: ${RETRY_WAIT_DURATION:-10s}

       # CircuitBreaker (вариант 2)
#      CIRCUITBREAKER_WAIT_DURATION_OPEN_STATE: ${CIRCUITBREAKER_WAIT_DURATION_OPEN_STATE:-10s}
#      CIRCUITBREAKER_FAILURE_RATE_THRESHOLD: ${CIRCUITBREAKER_FAILURE_RATE_THRESHOLD:-50}
#      CIRCUITBREAKER_SLIDING_WINDOW_SIZE: ${CIRCUITBREAKER_SLIDING_WINDOW_SIZE:-10}
#      CIRCUITBREAKER_MIN_CALLS: ${CIRCUITBREAKER_MIN_CALLS:-5}

      # Observability
      STATISTICS_OBSERVABILITY: true
      OBSERVABILITY_INTERVALS: 10,30,60
      SERVICE_STATISTIC_OBSERVABILITY_DELAY: 5000

networks:
  app-network:
    driver: bridge
